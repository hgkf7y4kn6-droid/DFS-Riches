# Captures DraftKings Sportsbook lines every two hours so the Big Picture has
# opening lines and line-movement history. Each pull also stores the next
# week's lookahead lines, so a week's openers are caught when DraftKings posts
# them. First through the site's /api/odds (its server stores each changed
# quote); DraftKings refuses some cloud servers, so when the site can't read
# it, this runner fetches DraftKings itself and stores the quotes (needs the
# DATABASE_URL secret). Logs show only capture counts and status.
name: Odds snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}      # backup: used only when the site's own pull failed
      ODDS_TRIGGER_SECRET: ${{ secrets.ODDS_TRIGGER_SECRET }}   # matches the server's; unset = open trigger
      # Cloudflare challenges GitHub runner IPs on the custom domain; Render's own address has no such wall.
      BIG_PICTURE_SITE: https://dfs-riches.onrender.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture DraftKings lines
        run: python -m app.big_picture.odds
