# Captures DraftKings Sportsbook lines every two hours so the Big Picture has
# opening lines and line-movement history. First through the site's
# /api/odds (its server stores each changed quote); DraftKings refuses some
# cloud servers, so when the site can't read it, this runner fetches
# DraftKings itself and stores the quotes (needs the DATABASE_URL secret).
# Logs show only capture counts and status.
name: Odds snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}      # backup: used only when the site's own pull failed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture DraftKings lines
        run: python -m app.big_picture.odds
