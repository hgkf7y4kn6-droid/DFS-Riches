# Captures DraftKings Sportsbook lines every two hours through the site's
# /api/odds (its server stores each changed quote), so the Big Picture has
# opening lines and line-movement history. No secrets; a few seconds a run.
name: Odds snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture DraftKings lines
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 \
            "https://dfsriches.richesdigitalventures.com/api/odds?summary=1" | head -c 300
