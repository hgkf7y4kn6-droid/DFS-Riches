# Known-vulnerability scan of the production dependencies, weekly and on dependency changes.
name: Security audit

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    paths: [requirements*.txt, mobile/package-lock.json, .github/workflows/security.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --omit=dev --audit-level=high
        working-directory: mobile
