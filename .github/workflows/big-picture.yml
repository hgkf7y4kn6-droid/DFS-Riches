# Big Picture (NFL Intelligence Desk) research run: builds the dossier, runs
# the research agents (CrewAI + LangChain + Llama via Hugging Face) and stores
# a new report version in Postgres, where the app's master-only Big Picture
# tab reads it. Runs here, not on the web server, for the memory the agent
# frameworks need. Logs show only metadata: the report stays in the database.
#
# Repository secrets: DATABASE_URL (Neon, same as the server),
# OPENROUTER_API_KEY (free models, tried first), HF_TOKEN (optional: faster
# model downloads; paid Hugging Face inference only with BIG_PICTURE_USE_HF=1).
# Without a working hosted model the run falls back to Llama 3.2 3B on this
# runner's CPU (free, slow -- hence the long timeout).
# Optional repository variables: OPENROUTER_MODELS, BIG_PICTURE_USE_HF,
# BIG_PICTURE_MODEL, BIG_PICTURE_PROVIDER.
name: Big Picture research run

on:
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (blank = the upcoming week)"
        required: false
      desk_only:
        description: "Skip the language model (desk template writing only)"
        type: boolean
        default: false
  schedule:
    - cron: "37 11 * * *"     # daily, 7:37 AM ET (EDT)
    - cron: "47 15 * * 0"     # Sundays 11:47 AM ET, after the early games' inactives

concurrency:
  group: big-picture
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
      BIG_PICTURE_USE_HF: ${{ vars.BIG_PICTURE_USE_HF }}
      BIG_PICTURE_MODEL: ${{ vars.BIG_PICTURE_MODEL }}
      BIG_PICTURE_PROVIDER: ${{ vars.BIG_PICTURE_PROVIDER }}
      BIG_PICTURE_WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-agents.txt
      - name: Install
        # The agent frameworks first, then the site's own pins on top: crewai pulls newer
        # starlette/httpx than FastAPI 0.115 supports, and the run imports the site's code.
        # (The agents run fine on the older httpx -- tests/test_big_picture_agents.py.)
        run: |
          pip install -r requirements-agents.txt
          pip install -r requirements.txt
      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          if [ -z "$OPENROUTER_API_KEY" ]; then echo "::warning::No OPENROUTER_API_KEY secret: the agents run on the runner's own Llama (slow)"; fi
      - name: Research run
        run: python -m app.big_picture.run ${{ inputs.desk_only && '--desk-only' || '' }}
